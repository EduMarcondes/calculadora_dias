services:
  backend:
    build: ./backend
    container_name: calculadora_backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=file:./dev.db
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
    command: sh -c "npm install && npx prisma db push && npm run dev"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: calculadora_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped